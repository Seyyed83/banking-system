spring.application.name=banking-system

spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
spring.datasource.username=${DB_USERNAME:banking_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true

# Bank fee account and transfer fee (fee = clamp(amount * rate, minimum, maximum)).
# Every setting can be overridden with an environment variable.
banking.system-account-number=${BANKING_SYSTEM_ACCOUNT_NUMBER:99999999999999}
banking.transfer-fee.rate=${BANKING_TRANSFER_FEE_RATE:0.001}
banking.transfer-fee.minimum=${BANKING_TRANSFER_FEE_MINIMUM:500}
banking.transfer-fee.maximum=${BANKING_TRANSFER_FEE_MAXIMUM:10000}

# API credentials must be provided through environment variables.
banking.security.username=${BANKING_API_USERNAME:banking-admin}
banking.security.password=${BANKING_API_PASSWORD:}

banking.worker.poll-interval-ms=${BANKING_WORKER_POLL_INTERVAL_MS:500}
banking.worker.max-batch-size=${BANKING_WORKER_MAX_BATCH_SIZE:50}
banking.worker.lease-seconds=${BANKING_WORKER_LEASE_SECONDS:120}
banking.worker.max-attempts=${BANKING_WORKER_MAX_ATTEMPTS:5}
banking.worker.enabled=${BANKING_WORKER_ENABLED:true}

# Redis balance cache (Oracle remains the source of truth; Redis failures fall back to Oracle).
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms
banking.cache.balance.enabled=${BANKING_CACHE_ENABLED:true}
banking.cache.balance.ttl-seconds=${BANKING_CACHE_BALANCE_TTL_SECONDS:30}

# Kafka: finalized transaction events are published from the Oracle outbox (at-least-once).
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.properties[acks]=all
spring.kafka.producer.properties[enable.idempotence]=true
spring.kafka.producer.properties[max.block.ms]=5000
spring.kafka.producer.properties[request.timeout.ms]=5000
spring.kafka.producer.properties[delivery.timeout.ms]=10000
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false

banking.kafka.enabled=${BANKING_KAFKA_ENABLED:true}
banking.kafka.topic=${BANKING_KAFKA_TOPIC:banking.transaction-events}
banking.kafka.topic-partitions=${BANKING_KAFKA_TOPIC_PARTITIONS:3}
banking.kafka.consumer.enabled=${BANKING_KAFKA_CONSUMER_ENABLED:true}
banking.kafka.consumer.group-id=${BANKING_KAFKA_CONSUMER_GROUP:banking-audit}
banking.kafka.publisher.poll-interval-ms=${BANKING_KAFKA_PUBLISHER_POLL_INTERVAL_MS:500}
banking.kafka.publisher.batch-size=${BANKING_KAFKA_PUBLISHER_BATCH_SIZE:50}
banking.kafka.publisher.lease-seconds=${BANKING_KAFKA_PUBLISHER_LEASE_SECONDS:60}
banking.kafka.publisher.max-attempts=${BANKING_KAFKA_PUBLISHER_MAX_ATTEMPTS:10}
banking.kafka.publisher.send-timeout-seconds=${BANKING_KAFKA_PUBLISHER_SEND_TIMEOUT_SECONDS:10}
