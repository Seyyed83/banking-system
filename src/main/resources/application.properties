spring.application.name=banking-system

spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
spring.datasource.username=${DB_USERNAME:banking_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true

# Bank fee account and transfer fee (fee = clamp(amount * rate, minimum, maximum)).
# Every setting can be overridden with an environment variable.
banking.system-account-number=${BANKING_SYSTEM_ACCOUNT_NUMBER:99999999999999}
banking.transfer-fee.rate=${BANKING_TRANSFER_FEE_RATE:0.001}
banking.transfer-fee.minimum=${BANKING_TRANSFER_FEE_MINIMUM:500}
banking.transfer-fee.maximum=${BANKING_TRANSFER_FEE_MAXIMUM:10000}

# API credentials must be provided through environment variables.
banking.security.username=${BANKING_API_USERNAME:banking-admin}
banking.security.password=${BANKING_API_PASSWORD:}